name: Desktop release candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, platform: darwin, arch: arm64}
          - {runner: macos-15-intel, platform: darwin, arch: x64}
          - {runner: windows-2025, platform: win32, arch: x64}
          - {runner: ubuntu-24.04, platform: linux, arch: x64}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node build-preview.cjs
      - if: runner.os == 'Linux'
        run: |
          npm run package -- linux x64
          sudo dpkg -i dist/artifacts/*.deb
          timeout 30s xvfb-run -a /opt/orbite/Orbite --orbite-package-smoke
      - if: runner.os != 'Linux'
        run: npm run package -- ${{ matrix.platform }} ${{ matrix.arch }} --smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Orbite-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/artifacts/Orbite-*
          if-no-files-found: error
          compression-level: 0

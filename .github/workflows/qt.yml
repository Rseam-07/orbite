name: Orbite Qt

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          archives: qtbase
          cache: true
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build build --parallel
      - name: Verify the ACP client and Qt workbench
        run: ctest --test-dir build --output-on-failure
      - name: Assemble an ad-hoc signed disk image
        run: scripts/package-macos.sh "$QT_ROOT_DIR" build dist
      - uses: actions/upload-artifact@v4
        with:
          name: Orbite-macOS-${{ matrix.arch }}
          path: dist/Orbite-*.dmg*

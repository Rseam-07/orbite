name: Orbite Qt

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          archives: qtbase
          cache: true
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build build --parallel
      - name: Verify the ACP client and Qt workbench
        run: ctest --test-dir build --output-on-failure
      - name: Assemble an ad-hoc signed disk image
        run: scripts/package-macos.sh "$QT_ROOT_DIR" build dist
      - uses: actions/upload-artifact@v4
        with:
          name: Orbite-macOS-${{ matrix.arch }}
          path: dist/Orbite-*.dmg*

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          archives: 'qtbase icu'
          install-deps: 'false'
      - name: Set up the X11 test desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libglvnd-dev
      - name: Configure, build, and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure --no-tests=error
      - name: Open a window and initialize an isolated profile
        run: |
          profile_dir="$(mktemp -d)"
          trap 'rm -rf -- "$profile_dir"' EXIT
          ldd "$QT_ROOT_DIR/plugins/platforms/libqxcb.so"
          xvfb-run -a -e /dev/stderr bash -euo pipefail -s -- "$profile_dir" <<'BASH'
          profile_dir="$1"
          xdotool getdisplaygeometry
          QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=xcb ./build/Orbite --profile "$profile_dir" &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for ((i=0; i<40; ++i)); do
            kill -0 "$app_pid" 2>/dev/null || { echo 'Orbite exited early' >&2; exit 1; }
            if test -s "$profile_dir/orbite.sqlite3" &&
                xdotool search --onlyvisible --pid "$app_pid" --all --name '^Orbite$' >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          echo 'Orbite window or initialized profile not found' >&2
          exit 1
          BASH

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          archives: qtbase
          install-deps: 'false'
      - name: Configure, build, and test
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" '-DCMAKE_CXX_FLAGS=/utf-8'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and extract a portable package
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'Orbite Windows Packaging QA'
          New-Item -ItemType Directory -Path (Join-Path $work 'stage'), (Join-Path $work 'extracted') -ErrorAction Stop | Out-Null
          $exe = Join-Path $work 'stage/Orbite.exe'
          Copy-Item ./build/Release/Orbite.exe -Destination $exe
          Copy-Item ./LICENSE, ./licenses/Qt-LGPL-3.0.txt, ./licenses/Qt-GPL-3.0.txt -Destination (Split-Path $exe)
          & (Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe') --release --no-translations --no-compiler-runtime $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Join-Path $work 'Orbite-windows-x64-qa.zip'
          Compress-Archive -Path (Join-Path $work 'stage/*') -DestinationPath $zip
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $work 'extracted')
          foreach ($file in 'Orbite.exe', 'Qt6Core.dll', 'Qt6Widgets.dll', 'Qt6Sql.dll', 'platforms/qwindows.dll', 'sqldrivers/qsqlite.dll', 'LICENSE', 'Qt-LGPL-3.0.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $work "extracted/$file") -PathType Leaf)) { throw "Package is missing $file" }
          }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Write-Output "Windows QA ZIP SHA-256: $sha"
      - name: Open the extracted package without Qt SDK paths
        shell: pwsh
        run: |
          $profileDir = Join-Path $env:RUNNER_TEMP ("orbite-smoke-" + [Guid]::NewGuid().ToString("N"))
          $process = $null
          try {
            $exe = Join-Path $env:RUNNER_TEMP 'Orbite Windows Packaging QA/extracted/Orbite.exe'
            Get-ChildItem Env: | Where-Object { $_.Name -match '^QT_|^QML' } | ForEach-Object { Remove-Item -LiteralPath ('Env:' + $_.Name) }
            $env:Path = (Join-Path $env:SystemRoot 'System32') + ';' + $env:SystemRoot
            $process = Start-Process -FilePath $exe -ArgumentList "--profile `"$profileDir`"" -PassThru -WorkingDirectory (Split-Path $exe)
            $started = $false
            for ($i = 0; $i -lt 40; $i++) {
              $process.Refresh()
              if ($process.HasExited) { throw "Orbite exited early: $($process.ExitCode)" }
              $db = Get-Item (Join-Path $profileDir 'orbite.sqlite3') -ErrorAction SilentlyContinue
              if ($process.MainWindowHandle -ne [IntPtr]::Zero -and $process.MainWindowTitle -ceq "Orbite" -and $db -and $db.Length -gt 0) {
                $started = $true
                break
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $started) { throw 'Orbite window or initialized profile not found' }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
            if (Test-Path -LiteralPath $profileDir) { Remove-Item -LiteralPath $profileDir -Recurse -Force }
          }

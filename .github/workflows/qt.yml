name: Orbite Qt

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          archives: qtbase
          cache: true
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build build --parallel
      - name: Verify the ACP client and Qt workbench
        run: ctest --test-dir build --output-on-failure
      - name: Assemble an ad-hoc signed disk image
        run: scripts/package-macos.sh "$QT_ROOT_DIR" build dist
      - uses: actions/upload-artifact@v4
        with:
          name: Orbite-macOS-${{ matrix.arch }}
          path: dist/Orbite-*.dmg*

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          archives: 'qtbase icu'
          install-deps: 'false'
      - name: Set up the X11 test desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libglvnd-dev
      - name: Configure, build, and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure --no-tests=error
      - name: Measure the workbench flip on the X11 test desktop
        run: |
          QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=1 QT_LOGGING_RULES=orbite.motion.debug=true ORBITE_VERIFY_X11_FLIP=1 \
            xvfb-run -a -s '-screen 0 1440x900x24' build/orbite_desktop_tests workbenchFlipPaintsBothDirectionsOnX11
      - name: Build and extract a portable Ubuntu package
        run: |
          work="$RUNNER_TEMP/orbite-linux-package"
          stage="$work/stage"
          extracted="$work/extracted"
          mkdir -p "$stage/bin" "$stage/lib" "$stage/plugins/platforms" "$stage/plugins/sqldrivers" "$extracted"
          install -m 755 build/Orbite "$stage/bin/Orbite"
          install -m 644 "$QT_ROOT_DIR/plugins/platforms/libqxcb.so" "$stage/plugins/platforms/"
          install -m 644 "$QT_ROOT_DIR/plugins/sqldrivers/libqsqlite.so" "$stage/plugins/sqldrivers/"
          install -m 644 LICENSE licenses/Qt-LGPL-3.0.txt licenses/Qt-GPL-3.0.txt "$stage/"
          {
            ldd build/Orbite
            ldd "$QT_ROOT_DIR/plugins/platforms/libqxcb.so"
            ldd "$QT_ROOT_DIR/plugins/sqldrivers/libqsqlite.so"
          } > "$work/linked-libraries"
          cat "$work/linked-libraries"
          if grep -F 'not found' "$work/linked-libraries"; then exit 1; fi
          while read -r soname location; do
            install -m 644 "$location" "$stage/lib/$soname"
          done < <(awk -v prefix="$QT_ROOT_DIR/lib/" '$2 == "=>" && index($3, prefix) == 1 && !seen[$1]++ { print $1, $3 }' "$work/linked-libraries")
          test -s "$stage/lib/libQt6Widgets.so.6"
          test -s "$stage/lib/libQt6Sql.so.6"
          test -s "$stage/lib/libicui18n.so.73"
          printf '[Paths]\nPrefix=..\nPlugins=plugins\n' > "$stage/bin/qt.conf"
          cat > "$stage/Orbite" <<'SH'
          #!/bin/sh
          set -eu
          root=$(CDPATH='' cd -- "$(dirname -- "$0")" && pwd -P)
          exec env LD_LIBRARY_PATH="$root/lib" "$root/bin/Orbite" "$@"
          SH
          chmod 755 "$stage/Orbite"
          tar -C "$stage" -czf "$work/Orbite-ubuntu-x64-qa.tar.gz" .
          tar -C "$extracted" -xzf "$work/Orbite-ubuntu-x64-qa.tar.gz"
          sha256sum "$work/Orbite-ubuntu-x64-qa.tar.gz"
          echo 'Ubuntu package file inventory:'
          tar -tzf "$work/Orbite-ubuntu-x64-qa.tar.gz" | LC_ALL=C sort
          echo 'Linux ABI requirements (version needs only; not an OS support claim):'
          for elf in "$extracted/bin/Orbite" "$extracted"/lib/* "$extracted"/plugins/*/*.so; do
            requirements="$(readelf --version-info --wide "$elf" |
              awk '/^Version .* section/ { needs = ($0 ~ /^Version needs section/) }
                   needs && /Name: (GLIBC_|GLIBCXX_|CXXABI_)/ {
                     for (i = 1; i < NF; i++)
                       if ($i == "Name:") print $(i + 1)
                   }' | LC_ALL=C sort -u | paste -sd ' ' -)"
            printf '%s: %s\n' "${elf#"$extracted/"}" "${requirements:-(no tagged glibc/libstdc++ requirements)}"
          done
          export LD_LIBRARY_PATH="$extracted/lib"
          {
            ldd "$extracted/bin/Orbite"
            ldd "$extracted/plugins/platforms/libqxcb.so"
            ldd "$extracted/plugins/sqldrivers/libqsqlite.so"
          } > "$work/extracted-libraries"
          cat "$work/extracted-libraries"
          if grep -E 'not found|/Qt/6\.' "$work/extracted-libraries"; then exit 1; fi
      - name: Open the extracted package under X11 without Qt SDK paths
        run: |
          profile_dir="$(mktemp -d)"
          trap 'rm -rf -- "$profile_dir"' EXIT
          package="$RUNNER_TEMP/orbite-linux-package/extracted/Orbite"
          env -u QT_ROOT_DIR -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH -u LD_LIBRARY_PATH -u QML2_IMPORT_PATH \
            PATH=/usr/bin:/bin xvfb-run -a -e /dev/stderr bash -euo pipefail -s -- "$profile_dir" "$package" <<'BASH'
          profile_dir="$1"
          xdotool getdisplaygeometry
          QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=xcb "$2" --profile "$profile_dir" &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for ((i=0; i<40; ++i)); do
            kill -0 "$app_pid" 2>/dev/null || { echo 'Orbite exited early' >&2; exit 1; }
            if test -s "$profile_dir/orbite.sqlite3" &&
                xdotool search --onlyvisible --pid "$app_pid" --all --name '^Orbite$' >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          echo 'Orbite window or initialized profile not found' >&2
          exit 1
          BASH

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          archives: qtbase
          install-deps: 'false'
      - name: Configure, build, and test
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" '-DCMAKE_CXX_FLAGS=/utf-8'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and extract a portable package
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'Orbite Windows Packaging QA'
          New-Item -ItemType Directory -Path (Join-Path $work 'stage'), (Join-Path $work 'extracted') -ErrorAction Stop | Out-Null
          $exe = Join-Path $work 'stage/Orbite.exe'
          Copy-Item ./build/Release/Orbite.exe -Destination $exe
          Copy-Item ./LICENSE, ./licenses/Qt-LGPL-3.0.txt, ./licenses/Qt-GPL-3.0.txt -Destination (Split-Path $exe)
          Copy-Item ./docs/windows-qa-readme.txt -Destination (Join-Path (Split-Path $exe) 'README-FIRST.txt')
          # The profile uses QSQLITE exclusively; keep the platform and SQLite plugins.
          & (Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe') --release --no-translations --no-compiler-runtime --no-system-d3d-compiler --exclude-plugins 'qsqlmimer,qsqlodbc,qsqlpsql' $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Join-Path $work 'Orbite-windows-x64-qa.zip'
          Compress-Archive -Path (Join-Path $work 'stage/*') -DestinationPath $zip
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $work 'extracted')
          foreach ($file in 'Orbite.exe', 'Qt6Core.dll', 'Qt6Widgets.dll', 'Qt6Sql.dll', 'platforms/qwindows.dll', 'sqldrivers/qsqlite.dll', 'LICENSE', 'Qt-LGPL-3.0.txt', 'Qt-GPL-3.0.txt', 'README-FIRST.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $work "extracted/$file") -PathType Leaf)) { throw "Package is missing $file" }
          }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Write-Output "Windows QA ZIP SHA-256: $sha"
          "$sha  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii
          $extracted = Join-Path $work 'extracted'
          foreach ($plugin in 'qsqlmimer.dll', 'qsqlodbc.dll', 'qsqlpsql.dll') {
            if (Test-Path -LiteralPath (Join-Path $extracted "sqldrivers/$plugin")) { throw "Unexpected SQL driver in ZIP: $plugin" }
          }
          if (Test-Path -LiteralPath (Join-Path $extracted 'D3Dcompiler_47.dll')) { throw 'Unexpected system Direct3D compiler in ZIP' }
          Write-Output 'Windows package file inventory:'
          Get-ChildItem -LiteralPath $extracted -File -Recurse -ErrorAction Stop |
            ForEach-Object { [IO.Path]::GetRelativePath($extracted, $_.FullName) } |
            Sort-Object | Write-Output
      - name: Open the extracted package without Qt SDK paths
        shell: pwsh
        run: |
          $profileDir = Join-Path $env:RUNNER_TEMP ("orbite-smoke-" + [Guid]::NewGuid().ToString("N"))
          $process = $null
          try {
            $exe = Join-Path $env:RUNNER_TEMP 'Orbite Windows Packaging QA/extracted/Orbite.exe'
            Get-ChildItem Env: | Where-Object { $_.Name -match '^QT_|^QML' } | ForEach-Object { Remove-Item -LiteralPath ('Env:' + $_.Name) }
            $env:Path = (Join-Path $env:SystemRoot 'System32') + ';' + $env:SystemRoot
            $process = Start-Process -FilePath $exe -ArgumentList "--profile `"$profileDir`"" -PassThru -WorkingDirectory (Split-Path $exe)
            $started = $false
            for ($i = 0; $i -lt 40; $i++) {
              $process.Refresh()
              if ($process.HasExited) { throw "Orbite exited early: $($process.ExitCode)" }
              $db = Get-Item (Join-Path $profileDir 'orbite.sqlite3') -ErrorAction SilentlyContinue
              if ($process.MainWindowHandle -ne [IntPtr]::Zero -and $process.MainWindowTitle -ceq "Orbite" -and $db -and $db.Length -gt 0) {
                $started = $true
                break
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $started) { throw 'Orbite window or initialized profile not found' }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
            if (Test-Path -LiteralPath $profileDir) { Remove-Item -LiteralPath $profileDir -Recurse -Force }
          }

      - name: Verify corresponding Qt Base source for the test download
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'Orbite Windows Packaging QA'
          $version = (& (Join-Path $env:QT_ROOT_DIR 'bin/qmake.exe') -query QT_VERSION)
          if ($LASTEXITCODE -ne 0 -or $version -ne '6.8.3') { throw 'No matched source archive for the Qt build' }
          $source = Join-Path $work 'qtbase-everywhere-src-6.8.3.tar.xz'
          & curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 120 --output $source 'https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtbase-everywhere-src-6.8.3.tar.xz'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant()
          if ($sha -ne '56001b905601bb9023d399f3ba780d7fa940f3e4861e496a7c490331f49e0b80') { throw 'Qt Base source SHA-256 mismatch' }
      - name: Retain the tested Windows ZIP and corresponding sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Orbite-Windows-x64-CI-test
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/Orbite Windows Packaging QA/Orbite-windows-x64-qa.zip
            ${{ runner.temp }}/Orbite Windows Packaging QA/Orbite-windows-x64-qa.zip.sha256
            ${{ runner.temp }}/Orbite Windows Packaging QA/qtbase-everywhere-src-6.8.3.tar.xz
